server:
  port: 8080

spring:
  application:
    name: chat

  datasource:
    url: jdbc:postgresql://localhost:5435/chat_db
    username: postgres
    password: pass_1234
    driver-class-name: org.postgresql.Driver

  # Jpa properties
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    private-key-path: certs/private_key.pem
    public-key-path: certs/public_key.pem
    # Lifetime of the access token (JWT). The client refreshes it 2 minutes before it expires.
    access-token-validity: 30m

  auth:
    refresh-token:
      validity: 7d
      # An already-rotated refresh token presented again within this window (two tabs racing, a lost response) gets
      # a new token; later than that it's treated as stolen and the whole session is revoked.
      reuse-grace: 10s
      # Secure = sent over HTTPS only (browsers also treat http://localhost as secure).
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      # Strict works when the app and the API are on the same site; use None (with cookie-secure) if they aren't.
      cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}

  cors:
    # Origins of the React app (comma-separated). Override in production: export CORS_ORIGINS=https://chat.example.com
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

  rabbitmq:
    enabled: true
    host: localhost
    stomp-port: 61613
    username: admin
    password: admin123
