server:
  port: 8080

spring:
  application:
    name: chat

  datasource:
    url: jdbc:postgresql://localhost:5435/chat_db
    username: postgres
    password: pass_1234
    driver-class-name: org.postgresql.Driver

  # Jpa properties
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    # Base64-encoded key, minimum 32 bytes. Override in real deployments:  export JWT_SECRET=$(openssl rand -base64 32)
    secret: ${JWT_SECRET:3yWWB/YKJpeDnrHncOGXiu40IG6jvDSfsLAzF008JFc=}
    expiration-ms: 86400000   # 24 hours
  cors:
    # Origins of the React app (comma-separated). Override in production: export CORS_ORIGINS=https://chat.example.com
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
